[project]
name = "merchant-knowledge-base"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "langgraph>=1.2.11",
    "loguru>=0.7.3",
    "python-dotenv>=1.2.3",
    "fastapi>=0.135.1",
    "uvicorn>=0.42.0",
    "python-multipart>=0.0.22",
    "langchain>=1.2.13",
    "langchain-openai>=1.1.11",
    "langchain-text-splitters>=0.3.0",
    "pymilvus[model]>=2.6.10",
    "pymilvus-model>=0.3.2",
    "flagembedding>=1.3.5",
    "minio>=7.2.20",
    "pymongo>=4.16.0",
    "requests>=2.32.5",
]

[[tool.uv.index]]
name = "tsinghua"
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true
